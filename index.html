<style>
/* Layout: one centered 16:9 stage holding the game canvas; key legend and touch pad sit beneath it.
   Single dark look by choice (space arcade, matching the mascot's purple backdrop). */
:root{
  --void:#1a0a2e;
  --purple:#562b73;
  --visor:#ffd24a;
  --suit:#ebe8e0;
  --coral:#f26b5b;
  --ink:#0d0617;
  --muted:#b7a3d0;
  --panel:#2a1448;
  --font-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--void)}
body{color:var(--suit);font-family:var(--font-mono);padding-inline:16px;padding-block:16px 24px;min-height:100%}
.stage{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
canvas{display:block;box-sizing:border-box;width:100%;height:auto;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:18px;background:var(--void);box-shadow:0 0 0 2px var(--purple),0 18px 40px rgba(0,0,0,.45);touch-action:none;outline:none;cursor:pointer}
canvas:focus-visible{box-shadow:0 0 0 3px var(--visor),0 18px 40px rgba(0,0,0,.45)}
.keys{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.keys span{display:inline-flex;gap:6px;align-items:center;min-width:0}
kbd{font:inherit;color:var(--suit);background:var(--panel);border:2px solid var(--ink);border-radius:7px;padding:2px 7px;box-shadow:0 2px 0 var(--ink)}
.keys button{font:inherit;color:var(--suit);background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.keys button:focus-visible,.pad button:focus-visible{outline:3px solid var(--visor);outline-offset:2px}
.pad{display:none;justify-content:space-between;gap:16px}
.pad-group{display:flex;gap:12px}
.pad button{font-family:var(--font-display);font-size:20px;color:var(--ink);background:var(--suit);border:4px solid var(--ink);border-radius:22px;min-width:76px;height:76px;padding:0 14px;box-shadow:0 5px 0 var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
.pad button.jump{background:var(--visor);min-width:96px}
.pad button.boost{background:var(--coral)}
.pad button.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.store{margin:14px 0 0;text-align:center;font-size:14px;color:var(--suit)}
.store a{color:var(--visor);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.credit{margin:8px 0 0;text-align:center;font-size:12px;color:var(--suit);opacity:.8}
.credit a{color:var(--visor);text-decoration:underline;text-underline-offset:3px}
.credit a:hover,.credit a:focus-visible{color:var(--coral);outline:none}
.store .fb{display:inline-flex;vertical-align:middle;margin-left:10px;color:var(--visor);text-decoration:none}
.store a:hover,.store a:focus-visible{color:var(--coral);outline:none}
.lbform{position:absolute;left:50%;top:calc(56.25cqw*.775);transform:translateX(-50%);display:flex;align-items:center;gap:1.2cqw;flex-wrap:wrap;justify-content:center;font-size:clamp(11px,1.9cqw,17px);font-family:var(--font-display);color:var(--suit);background:rgba(26,10,46,.92);border:max(2px,.4cqw) solid var(--ink);border-radius:999px;padding:.5em 1.1em;max-width:94cqw}
.lbform[hidden]{display:none}
.lbform input{font:inherit;color:var(--ink);background:var(--suit);border:2px solid var(--ink);border-radius:999px;padding:.25em .8em;width:9em;outline:none}
.lbform input:focus-visible{box-shadow:0 0 0 3px var(--visor)}
.lbform button{font:inherit;color:var(--ink);background:var(--visor);border:2px solid var(--ink);border-radius:999px;padding:.25em 1em;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.lbform button:disabled{opacity:.5;cursor:default}
.lbmsg{font-size:.85em;color:var(--visor)}
.play{width:100%}
.frame{container-type:inline-size;display:flex;flex-direction:column;gap:14px;position:relative}
.fsbar{display:none}
.fsbar button,.keys #fs{font:inherit;font-size:13px;color:var(--ink);background:var(--visor);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.fsbar button{opacity:.8}
html.fs,html.fs body{overflow:hidden;height:100%;overscroll-behavior:none}
.play.full{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.play.full .frame{display:block;width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9}
.play.full canvas{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
.play.full.portrait .frame{width:min(100dvh,calc(100vw * 16 / 9));transform:rotate(90deg)}
/* --u = 1% of the game's height, set from script, so touch controls scale with the picture */
.play.full .pad{position:absolute;left:0;right:0;bottom:0;gap:0;padding:0 max(calc(var(--u,5px)*2),env(safe-area-inset-left)) calc(var(--u,5px)*2) max(calc(var(--u,5px)*2),env(safe-area-inset-right));pointer-events:none}
.play.full .pad-group{gap:calc(var(--u,5px)*2)}
.play.full .pad button{pointer-events:auto;opacity:.78;min-width:calc(var(--u,5px)*18);height:calc(var(--u,5px)*18);font-size:calc(var(--u,5px)*4.6);border-radius:calc(var(--u,5px)*4.5);border-width:max(2px,calc(var(--u,5px)*.8));padding:0 calc(var(--u,5px)*2);box-shadow:0 calc(var(--u,5px)*.9) 0 var(--ink)}
.play.full .pad button.jump{min-width:calc(var(--u,5px)*24)}
.play.full .pad button.on{transform:translateY(calc(var(--u,5px)*.7));box-shadow:0 0 0 var(--ink)}
.play.full .fsbar{display:flex;position:absolute;left:50%;bottom:calc(var(--u,5px)*2);transform:translateX(-50%);gap:calc(var(--u,5px)*1.5)}
.play.full .fsbar button{font-size:max(11px,calc(var(--u,5px)*3.4));padding:max(4px,calc(var(--u,5px)*.9)) max(10px,calc(var(--u,5px)*2.4));border-width:max(2px,calc(var(--u,5px)*.5))}
@media (pointer:coarse){.pad{display:flex}.keys .kb{display:none}}
</style>

(function(){

  var q=new URLSearchParams(location.search);
  if(!q.get('frame_id'))return;
  var D=window.COSMO_DISCORD={on:true,ready:false,open:function(){}};
  document.documentElement.classList.add('in-discord');
  var src=window.parent.opener||window.parent,origin=document.referrer||'*';
  var OK=[location.origin,'https://discord.com','https://discordapp.com','https://ptb.discord.com','https://ptb.discordapp.com','https://canary.discord.com','https://canary.discordapp.com','https://staging.discord.co','https://pax.discord.com','null'];
  var pending={};
  function uid(){try{return crypto.randomUUID();}catch(e){return 'n'+Date.now()+Math.random().toString(16).slice(2);}}
  function send(cmd,args){var nonce=uid();src.postMessage([1,{cmd:cmd,args:args,nonce:nonce}],origin);return new Promise(function(res,rej){pending[nonce]={res:res,rej:rej};});}
  window.addEventListener('message',function(e){
    if(OK.indexOf(e.origin)<0)return;var t=e.data;if(!Array.isArray(t)||t[0]!==1||!t[1])return;var d=t[1];
    if(d.cmd==='DISPATCH'){if(d.evt==='READY')D.ready=true;return;}
    var p=d.nonce&&pending[d.nonce];if(!p)return;delete pending[d.nonce];
    if(d.evt==='ERROR')p.rej(d.data);else p.res(d);
  });
  D.open=function(url){return send('OPEN_EXTERNAL_LINK',{url:url}).catch(function(){});};
  var hs={v:1,encoding:'json',client_id:CLIENT_ID,frame_id:q.get('frame_id')};
  var mv=parseInt((q.get('mobile_app_version')||'').split('.')[0],10);
  if(q.get('platform')!=='mobile'||mv>=250)hs.sdk_version='2.5.0';
  src.postMessage([0,hs],origin);
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest&&e.target.closest('a[href^="http"]');if(!a)return;
    e.preventDefault();D.open(a.href);
  },true);
})();

<script>
(function(){
'use strict';
const W=960,H=540,TAU=Math.PI*2,INK='#0d0617';
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ov=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const CARD=[
  {fill:'#f1ecd6',gem:'#e0b83c'},{fill:'#4aa3e0',gem:'#d2edff'},{fill:'#5a4573',gem:'#c9b6e4'},
  {fill:'#ea5a49',gem:'#ffd8c6'},{fill:'#4fb06c',gem:'#dcf7cc'}
];
const G=820,JUMP=410,RUN=235,VP=3.4,VE=2.4,START_X=240;

let state='title',T=0,titleCam=0,full=false;
const coarse=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);
let rocks=[],plats=[],spikes=[],vents=[],cards=[],parts=[],pops=[],stars=[],warns=[],amb=[];
let gates=[],drones=[];const wind={state:'idle',t:0,dir:1,next:0};const GP=3.4;
let gx=600,gTop=400,p,safe=null,cam={x:0};
let lives=3,cardCount=0,cardPts=0,dist=0,score=0,best=0,setHave=[0,0,0,0,0];
let shake=0,flash=0,nextStar=0,nextAmb=1,deadT=0,newBest=false,jumpBuf=0,muted=false,AC=null,pruneT=0;
try{best=+localStorage.getItem('cosmo-card-hop-best')||0}catch(e){}

/* ---------- world generation ---------- */
const diff=x=>clamp(x/18000,0,1);

function addRock(x,w,top){
  const h=rnd(150,200),n=Math.max(2,Math.round(w/70)),jag=[],craters=[];
  for(let i=0;i<=n;i++){const edge=i===0||i===n;jag.push(h*(edge?rnd(.45,.6):rnd(.65,1)));}
  const nc=rint(1,3+Math.floor(w/300));
  for(let i=0;i<nc;i++)craters.push({dx:rnd(20,w-20),dy:rnd(28,h*.5),rx:rnd(8,20),ry:rnd(4,8)});
  const r={x,y:top,w,h,jag,craters,sulf:null};rocks.push(r);return r;
}
let colorBag=[];
function nextColor(){
  if(!colorBag.length){colorBag=[0,1,2,3,4];for(let i=4;i>0;i--){const j=rint(0,i);[colorBag[i],colorBag[j]]=[colorBag[j],colorBag[i]];}}
  return colorBag.pop();
}
function addCard(x,y){cards.push({x,y,col:nextColor(),foil:Math.random()<.07,ph:Math.random()*6,taken:false});}
function cardArc(cx,baseY,n,sp,h){
  for(let i=0;i<n;i++){const t=n===1?.5:i/(n-1);addCard(cx+(t-.5)*(n-1)*sp,baseY-Math.sin(t*Math.PI)*h);}
}
function cardRow(cx,y,n,sp){for(let i=0;i<n;i++)addCard(cx+(i-(n-1)/2)*sp,y);}

function rockWithFeatures(x,w,top,margin,safeZone){
  const r=addRock(x,w,top),d=diff(x),L=margin||120,R=110,span=w-L-R;
  let did=false;
  if(!safeZone&&x>1300&&span>=90){
    const pSpike=.28+.4*d,pVent=x>2400?.22+.3*d:0,roll=Math.random();
    const pGate=x>3200&&span>=240?.17+.13*d:0,pDrone=x>3000&&span>=190?.15+.13*d:0;
    if(roll<pSpike){
      const sw=rint(2,4+Math.floor(d*2))*20,sx=x+L+rnd(0,Math.max(0,span-sw));
      spikes.push({x:sx,y:top,w:sw});cardArc(sx+sw/2,top-34,2,44,60);did=true;
    }else if(roll<pSpike+pVent){
      const vx=x+L+rnd(40,Math.max(40,span-40));
      vents.push({x:vx,y:top,off:rnd(0,VP)});r.sulf=vx-x;cardArc(vx,top-40,3,46,135);did=true;
    }else if(roll<pSpike+pVent+pGate){
      const g0=x+L+rnd(50,Math.max(50,span-90));
      gates.push({x:g0,y:top,h:170,off:rnd(0,GP)});
      cardRow(g0+58,top-30,2,34);addCard(g0,top-170-26);did=true;
    }else if(roll<pSpike+pVent+pGate+pDrone){
      const rg=Math.min(95,span*.4),c0=x+L+rg+rnd(0,Math.max(0,span-2*rg));
      drones.push({x:c0,y:top-rnd(82,112),r:rg,spd:rnd(1.1,1.6),ph:rnd(0,6),gy:top});
      cardRow(c0,top-30,2,40);did=true;
    }
  }
  if(!did&&Math.random()<.65)cardRow(x+w/2+rnd(-60,60),top-30,rint(1,3),38);
  return r;
}

function genFlat(){
  const top=clamp(gTop+rnd(-45,40),340,415),w=rnd(340,620);
  rockWithFeatures(gx,w,top,120);gx+=w;gTop=top;
}
function genGap(){
  const d=diff(gx),gap=Math.min(225,rnd(90,150+70*d));
  let nt=clamp(gTop+rnd(-60,40),340,415);
  if(gap>170&&gTop-nt>40)nt=gTop-40;
  if(gap>140&&(gap>185||Math.random()<.35)){
    plats.push({x:gx+gap/2-45,y:(gTop+nt)/2-10,w:90});
  }
  if(Math.random()<.6)cardArc(gx+gap/2,Math.min(gTop,nt)-30,3,40,70);
  const w=rnd(300,520);
  rockWithFeatures(gx+gap,w,nt,150);gx+=gap+w;gTop=nt;
}
function genIslands(){
  const d=diff(gx),n=rint(3,5);
  let x=gx,py=gTop;
  for(let i=0;i<n;i++){
    x+=rnd(70,120+30*d);
    const pw=rnd(90,140),y=clamp(py+rnd(-70,45),200,410);
    plats.push({x,y,y0:y,w:pw,crystal:gx>2600&&Math.random()<.5,trig:false,t:0,drop:false,vy:0});if(Math.random()<.55)cardRow(x+pw/2,y-30,1,30);
    x+=pw;py=y;
  }
  x+=rnd(70,110);
  const top=clamp(py+rnd(0,60),340,415),w=rnd(320,500);
  rockWithFeatures(x,w,top,130);gx=x+w;gTop=top;
}
function genSteps(){
  const n=rint(3,4);let x=gx,top=gTop;
  for(let i=0;i<n;i++){
    const w=rnd(130,190);top=Math.max(250,top-rnd(32,45));
    const r=addRock(x,w,top);x+=w;
    if(i===n-1)cardRow(r.x+w/2,top-30,2,40);
  }
  gx=x;gTop=top;
}
function genChunk(){
  if(gx<1500){(Math.random()<.5?genFlat:genGap)();return;}
  const wts=[[genFlat,2.5],[genGap,3],[genIslands,gx>2000?1.6:0],[genSteps,gx>1800?1.2:0]];
  let t=wts.reduce((a,b)=>a+b[1],0)*Math.random();
  for(const [f,w] of wts){t-=w;if(t<=0){f();return;}}
  genFlat();
}
function resetWorld(){
  rocks=[];plats=[];spikes=[];vents=[];gates=[];drones=[];cards=[];parts=[];pops=[];stars=[];warns=[];
  addRock(-300,900,400);gx=600;gTop=400;
  colorBag=[];cardRow(420,370,3,44);
}
function ensureWorld(){while(gx<cam.x+W+700)genChunk();}
function prune(){
  const lim=cam.x-900;
  rocks=rocks.filter(r=>r.x+r.w>lim);plats=plats.filter(r=>r.x+r.w>lim&&!(r.drop&&r.y>H+160&&false));gates=gates.filter(r=>r.x>lim);drones=drones.filter(r=>r.x+r.r>lim);
  spikes=spikes.filter(r=>r.x+r.w>lim);vents=vents.filter(r=>r.x>lim);cards=cards.filter(r=>r.x>lim&&!r.taken);
}

/* ---------- audio ---------- */
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function tone(f0,f1,dur,type,vol,delay){
  if(muted||!AC)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
function sfx(k){
  if(k==='jump')tone(280,560,.14,'sine',.12);
  else if(k==='land')tone(120,70,.08,'sine',.08);
  else if(k==='card')tone(660,990,.12,'triangle',.12);
  else if(k==='foil'){[660,830,990,1320].forEach((f,i)=>tone(f,f*1.02,.14,'triangle',.11,i*.06));}
  else if(k==='set'){[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.18,'square',.07,i*.07));}
  else if(k==='hit')tone(220,50,.28,'sawtooth',.14);
  else if(k==='fall')tone(420,70,.45,'sine',.12);
  else if(k==='warn')tone(900,900,.05,'square',.04);
}

/* ---------- input ---------- */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',
  ShiftLeft:'boost',ShiftRight:'boost',KeyX:'boost',KeyZ:'boost'};
const keys=new Set(),touch={left:false,right:false,jump:false,boost:false};
function held(a){if(touch[a])return true;for(const c of keys)if(KM[c]===a)return true;return false;}
function idle(){return state==='title'||state==='dead';}
function tryStart(){if(state==='title'||(state==='dead'&&deadT>.6))startGame();}
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  ensureAudio();
  const a=KM[e.code];
  if(a||e.code==='Enter'||e.code==='KeyP'||e.code==='Escape'||e.code==='KeyM'){
    if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  }
  if(a){
    if(!e.repeat){
      keys.add(e.code);
      if(a==='jump'){if(idle())tryStart();else if(state==='paused')setPause(false);else jumpBuf=.13;}
    }
  }else if(e.code==='Enter'){if(idle())tryStart();else if(state==='paused')setPause(false);}
  else if(e.code==='KeyP'||e.code==='Escape'){setPause(state==='play');}
  else if(e.code==='KeyQ'&&!e.repeat){toMenu();}
  else if(e.code==='KeyM')toggleMute();
  else if(e.code==='KeyF'&&!e.repeat)toggleFull();
});
window.addEventListener('keyup',e=>{keys.delete(e.code);});
window.addEventListener('blur',()=>{keys.clear();if(state==='play')setPause(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')setPause(true);});
cv.addEventListener('pointerdown',e=>{
  ensureAudio();try{cv.focus();}catch(_){}
  if(idle())tryStart();else if(state==='paused')setPause(false);
});
function bindBtn(id,act){
  const b=$(id);
  const on=e=>{e.preventDefault();ensureAudio();touch[act]=true;b.classList.add('on');
    try{b.setPointerCapture(e.pointerId);}catch(_){}
    if(act==='jump'){if(idle())tryStart();else if(state==='paused')setPause(false);else jumpBuf=.13;}};
  const off=()=>{touch[act]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,off));
}
bindBtn('bL','left');bindBtn('bR','right');bindBtn('bJ','jump');bindBtn('bB','boost');
function toggleMute(){muted=!muted;$('snd').textContent=muted?'Sound off':'Sound on';}
$('snd').addEventListener('click',()=>{ensureAudio();toggleMute();});
function toMenu(){
  if(state==='title')return;
  keys.clear();for(const k in touch)touch[k]=false;
  if(typeof lbForm!=='undefined'&&lbForm)lbForm.hidden=true;
  resetWorld();p=makePlayer();cam={x:-100};ensureWorld();
  wind.state='idle';warns=[];stars=[];flash=0;shake=0;
  state='title';
  if(typeof lbFetch==='function')lbFetch();
}
function setPause(on){
  if(on&&state==='play'){state='paused';keys.clear();for(const k in touch)touch[k]=false;}
  else if(!on&&state==='paused'){state='play';}
}

/* ---------- player + effects ---------- */
function makePlayer(){
  return {x:START_X,y:400,vx:0,vy:0,hw:13,h:58,on:true,gt:0,coy:0,fuel:1,dir:1,sx:1,sy:1,
    inv:0,hurt:0,happy:0,blink:3,boosting:false,surf:null,run:0};
}
function emit(x,y,n,o){
  for(let i=0;i<n;i++){
    const a=o.a!==undefined?o.a+rnd(-o.sp,o.sp):rnd(0,TAU),s=rnd(o.s0,o.s1);
    parts.push({x:x+rnd(-(o.jx||0),o.jx||0),y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:rnd(o.l0,o.l1),
      c:o.c[i%o.c.length],z:rnd(o.z0,o.z1),g:o.g||0,star:!!o.star});
  }
}
function pop(x,y,s,c){pops.push({x,y,s,c,life:0});}
function updateFx(dt){
  for(const q of parts){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;}
  parts=parts.filter(q=>q.life<q.max);
  for(const q of pops){q.life+=dt;q.y-=34*dt;}
  pops=pops.filter(q=>q.life<1.1);
  shake=Math.max(0,shake-dt*1.8);flash=Math.max(0,flash-dt*2.2);
  nextAmb-=dt;
  if(nextAmb<=0){nextAmb=rnd(1.2,3.5);amb.push({x:rnd(W*.2,W),y:rnd(0,H*.35),vx:-rnd(500,800),vy:rnd(150,280),life:0,max:rnd(.5,.9)});}
  for(const a of amb){a.life+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;}
  amb=amb.filter(a=>a.life<a.max);

/* ---------- vents ---------- */
function ventT(v){return (T+v.off)%VP;}
function gateState(g){const t=(T+g.off)%GP;return t<1.7?0:(t<2.2?1:2);}   // 0 off, 1 warning flicker, 2 beam on
function droneX(d){return d.x+Math.sin(T*d.spd+d.ph)*d.r;}
function droneY(d){return d.y+Math.sin(T*2.1+d.ph)*6;}
function windAx(){return wind.state==='blow'?wind.dir*(p.on?240:700):0;}
function plumeH(v){
  const t=ventT(v);if(t<VE)return 0;
  const u=(t-VE)/(VP-VE);
  return 175*Math.min(1,u*5)*(u>.85?(1-u)/.15:1);
}

/* ---------- damage ---------- */
function hurtPlayer(){
  if(p.inv>0||state!=='play')return;
  lives--;p.inv=1.8;p.hurt=.4;p.vy=-300;p.vx=-p.dir*180;shake=reduced?0:.35;sfx('hit');
  emit(p.x,p.y-30,14,{s0:80,s1:230,l0:.3,l1:.6,z0:2,z1:5,c:['#f26b5b','#ffd24a','#ebe8e0'],g:300});
  if(lives<=0)gameOver();
}
function fellOff(){
  lives--;sfx('fall');
  if(lives<=0){gameOver();return;}
  const s=safe||{x:START_X,y:400};
  for(const q of plats)if(q.crystal){q.trig=false;q.t=0;q.drop=false;q.vy=0;q.y=q.y0;}
  p.x=s.x;p.y=s.y;p.vx=0;p.vy=0;p.inv=2.2;p.fuel=1;p.on=true;
  cam.x=Math.min(cam.x,p.x-340);
}
let runStart=0,runSecs=0;
function gameOver(){
  state='dead';deadT=0;runSecs=T-runStart;lbOnDead();
  newBest=score>best;
  if(newBest){best=score;try{localStorage.setItem('cosmo-card-hop-best',String(best));}catch(e){}}
}
function startGame(){
  resetWorld();p=makePlayer();cam={x:p.x-340};
  lives=3;cardCount=0;cardPts=0;dist=0;score=0;setHave=[0,0,0,0,0];
  safe={x:p.x,y:p.y};stars=[];warns=[];nextStar=T+9;wind.state='idle';wind.t=0;wind.next=T+16;jumpBuf=0;pruneT=0;flash=0;shake=0;
  ensureWorld();state='play';runStart=T;lbOnStart();
}

function collect(c){
  c.taken=true;cardCount++;
  const pts=c.foil?500:100;cardPts+=pts;p.happy=.45;
  let slot=c.col;
  if(c.foil){const m=setHave.indexOf(0);if(m>=0)slot=m;}
  setHave[slot]=1;
  emit(c.x,c.y,c.foil?18:10,{s0:60,s1:200,l0:.35,l1:.7,z0:2,z1:4.5,c:c.foil?['#ffd24a','#4aa3e0','#ea5a49','#4fb06c']:[CARD[c.col].fill,CARD[c.col].gem],star:true});
  pop(c.x,c.y-16,'+'+pts,c.foil?'#ffd24a':'#ebe8e0');
  sfx(c.foil?'foil':'card');
  if(setHave.every(v=>v)){
    setHave=[0,0,0,0,0];cardPts+=1000;
    if(lives<5)lives++;
    flash=reduced?0:1;sfx('set');
    pop(p.x,p.y-90,'SET COMPLETE +1000','#ffd24a');
    emit(p.x,p.y-40,30,{s0:100,s1:300,l0:.5,l1:1,z0:3,z1:6,c:['#ffd24a','#f26b5b','#4aa3e0','#4fb06c','#ebe8e0'],star:true});
  }
}

/* ---------- shooting stars ---------- */
/* Meteors live in the world: they aim at a spot on the terrain ahead and crash into it. */
function groundAt(x){
  let y=null;
  for(const r of rocks)if(x>=r.x&&x<=r.x+r.w&&(y===null||r.y<y))y=r.y;
  for(const s of plats)if(!s.drop&&x>=s.x&&x<=s.x+s.w&&(y===null||s.y<y))y=s.y;
  return y;
}
function spawnWarn(){
  for(let tries=0;tries<8;tries++){
    const tx=clamp(p.x+rnd(90,430),cam.x+60,cam.x+W-60),gy=groundAt(tx);
    if(gy===null)continue;
    const fl=rnd(1.0,1.3),sx=tx+rnd(140,300),sy=-50;
    warns.push({tx,gy,sx,sy,vx:(tx-sx)/fl,vy:(gy-sy)/fl,t:1.2,beep:false});
    return;
  }
}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh),dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}

/* ---------- main step ---------- */
function step(dt){
  T+=dt;
  p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt);p.happy=Math.max(0,p.happy-dt);
  p.blink-=dt;if(p.blink<-.12)p.blink=rnd(2,4.5);
  jumpBuf-=dt;
  const L=held('left'),R=held('right'),JH=held('jump'),BH=held('boost');
  const tgt=(R?1:0)-(L?1:0);
  if(tgt){
    p.vx+=tgt*(p.on?2600:1500)*dt;p.dir=tgt;
  }else{
    const f=(p.on?2200:500)*dt;
    p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f;
  }
  p.vx=clamp(p.vx,-RUN,RUN);
  { const wa=windAx(); if(wa){p.vx=clamp(p.vx+wa*dt,-RUN-130,RUN+130);} }
  p.run=p.on?Math.min(1,Math.abs(p.vx)/RUN):0;
  p.coy=p.on?.1:p.coy-dt;
  if(jumpBuf>0&&p.coy>0){
    p.vy=-JUMP;p.on=false;p.coy=0;jumpBuf=0;p.sx=.85;p.sy=1.2;sfx('jump');
    emit(p.x,p.y,5,{a:-Math.PI/2,sp:1.2,s0:20,s1:70,l0:.2,l1:.4,z0:2,z1:4,c:['#9a6bc4','#cbb6e6']});
  }
  p.boosting=false;
  if(BH&&p.fuel>0){
    p.boosting=true;p.fuel=Math.max(0,p.fuel-dt/1.1);
    p.vy-=1300*dt;if(p.vy<-220)p.vy=-220;
    if(Math.random()<.4)emit(p.x-p.dir*18,p.y-20,1,{a:Math.PI/2,sp:.35,s0:120,s1:220,l0:.25,l1:.45,z0:3,z1:6,c:['#ffd24a','#f2a55b','#f26b5b']});
  }else if(p.on){p.fuel=Math.min(1,p.fuel+dt/1.2);}
  let grav=G;
  if(p.vy<0&&!JH&&!p.boosting)grav*=2.4;
  p.vy=Math.min(p.vy+grav*dt,520);
  moveCollide(dt);
  p.sx+=(1-p.sx)*Math.min(1,12*dt);p.sy+=(1-p.sy)*Math.min(1,12*dt);
  p.gt=p.on?p.gt+dt:0;
  if(p.y-p.h<-40){p.y=-40+p.h;if(p.vy<0)p.vy=0;}
  /* safe spot for respawn */
  if(p.on&&p.gt>.2&&p.surf){
    const s=p.surf,okEdge=s.h!==undefined?(p.x>s.x+30&&p.x<s.x+s.w-30):true;
    let ok=okEdge;
    for(const sp of spikes)if(p.x>sp.x-80&&p.x<sp.x+sp.w+80)ok=false;
    for(const v of vents)if(Math.abs(v.x-p.x)<110)ok=false;
    for(const g of gates)if(Math.abs(g.x-p.x)<100)ok=false;
    for(const dr of drones)if(Math.abs(dr.x-p.x)<dr.r+70)ok=false;
    if(s.crystal)ok=false;
    if(ok)safe={x:p.x,y:p.y};
  }
  /* camera */
  const tx=p.x-340;if(tx>cam.x)cam.x+=(tx-cam.x)*Math.min(1,8*dt);
  if(p.x<cam.x+22){p.x=cam.x+22;if(p.vx<0)p.vx=0;}
  dist=Math.max(dist,(p.x-START_X)/40);
  ensureWorld();
  pruneT+=dt;if(pruneT>.5){pruneT=0;prune();}
  /* hazards */
  const bx=p.x-p.hw+3,by=p.y-p.h+8,bw=p.hw*2-6,bh=p.h-8;
  for(const s of spikes){
    if(s.x>p.x+200||s.x+s.w<p.x-200)continue;
    if(ov(bx,by,bw,bh,s.x+4,s.y-20,s.w-8,20))hurtPlayer();
  }
  for(const v of vents){
    if(Math.abs(v.x-p.x)>200)continue;
    const h=plumeH(v);
    if(h>20&&ov(bx,by,bw,bh,v.x-13,v.y-h,26,h))hurtPlayer();
  }
  for(const g of gates){
    if(Math.abs(g.x-p.x)>140)continue;
    if(gateState(g)===2&&ov(bx,by,bw,bh,g.x-8,g.y-g.h,16,g.h))hurtPlayer();
  }
  for(const dr of drones){
    if(Math.abs(dr.x-p.x)>dr.r+70)continue;
    if(circleRect(droneX(dr),droneY(dr),17,bx,by,bw,bh))hurtPlayer();
  }
  /* crystal platforms crack, then fall */
  if(p.on&&p.surf&&p.surf.crystal&&!p.surf.trig){p.surf.trig=true;p.surf.t=0;tone(1100,500,.07,'square',.05);}
  for(const s of plats){
    if(!s.crystal||!s.trig)continue;
    s.t+=dt;
    if(s.t>.6&&!s.drop){
      s.drop=true;s.vy=0;tone(220,60,.25,'sawtooth',.08);
      emit(s.x+s.w/2,s.y+6,16,{s0:40,s1:170,l0:.4,l1:.9,z0:2,z1:5,c:['#bfe9ff','#7fb8e8','#ffffff'],g:500,star:true,jx:s.w/2});
    }
    if(s.drop&&s.y<H+400){s.vy+=900*dt;s.y+=s.vy*dt;}
  }
  /* solar wind */
  if(p.x>3200&&wind.state==='idle'&&T>=wind.next){wind.state='warn';wind.t=1.3;wind.dir=Math.random()<.5?-1:1;sfx('warn');}
  else if(wind.state==='warn'){wind.t-=dt;if(wind.t<=0){wind.state='blow';wind.t=rnd(1.8,2.6);}}
  else if(wind.state==='blow'){wind.t-=dt;if(wind.t<=0){wind.state='idle';wind.next=T+lerp(13,7,diff(p.x))+rnd(0,3);}}
  /* cards */
  for(const c of cards){
    if(c.taken||Math.abs(c.x-p.x)>40)continue;
    if(c.x>p.x-p.hw-12&&c.x<p.x+p.hw+12&&c.y>p.y-p.h-14&&c.y<p.y+14){collect(c);if(state!=='play')return;}
  }
  /* shooting stars */
  if(p.x>1800&&T>=nextStar){
    const d=diff(p.x);
    spawnWarn();if(d>.55&&Math.random()<.4)spawnWarn();
    nextStar=T+lerp(7,2.6,d)+rnd(0,1.5);
  }
  for(const w of warns){
    w.t-=dt;
    if(!w.beep){w.beep=true;sfx('warn');}
    if(w.t<=0)stars.push({x:w.sx,y:w.sy,vx:w.vx,vy:w.vy,gy:w.gy,done:false});
  }
  warns=warns.filter(w=>w.t>0);
  for(const s of stars){
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(circleRect(s.x,s.y,11,p.x-p.hw+3,p.y-p.h+8,p.hw*2-6,p.h-8))hurtPlayer();
    if(s.y>=s.gy-6){
      s.done=true;shake=Math.max(shake,reduced?0:.2);tone(160,40,.25,'sawtooth',.1);
      emit(s.x,s.gy-4,16,{a:-Math.PI/2,sp:1.1,s0:80,s1:260,l0:.3,l1:.7,z0:2,z1:5,c:['#ffb25a','#fff3c4','#f26b5b','#9a6bc4'],g:500});
      emit(s.x,s.gy-4,8,{a:-Math.PI/2,sp:1.3,s0:30,s1:120,l0:.5,l1:.9,z0:4,z1:8,c:['#6a3d8f','#4a2a6b'],g:200});
    }
  }
  stars=stars.filter(s=>!s.done&&s.y<H+80&&s.x>cam.x-250);
  if(p.y>H+110)fellOff();
  updateFx(dt);
  score=Math.floor(dist)*10+cardPts;
}

function moveCollide(dt){
  p.x+=p.vx*dt;
  for(const r of rocks){
    if(r.x>p.x+80||r.x+r.w<p.x-80)continue;
    if(ov(p.x-p.hw,p.y-p.h,p.hw*2,p.h,r.x,r.y,r.w,r.h)){
      if(p.y-r.y<=8&&p.vy>=0){p.y=r.y;continue;}
      if(p.vx>0)p.x=r.x-p.hw;else if(p.vx<0)p.x=r.x+r.w+p.hw;
      p.vx=0;
    }
  }
  const y0=p.y;
  p.y+=p.vy*dt;
  const wasOn=p.on;p.on=false;
  if(p.vy>=0){
    const land=(s,top)=>{
      const vy=p.vy;p.y=top;p.vy=0;p.on=true;p.surf=s;
      if(!wasOn&&vy>200){p.sx=1.18;p.sy=.8;sfx('land');
        emit(p.x,p.y,6,{a:-Math.PI/2,sp:1.4,s0:30,s1:90,l0:.25,l1:.45,z0:2,z1:4,c:['#9a6bc4','#cbb6e6']});}
    };
    for(const r of rocks){
      if(p.x+p.hw>r.x+1&&p.x-p.hw<r.x+r.w-1&&y0<=r.y+.5&&p.y>=r.y){land(r,r.y);break;}
    }
    if(!p.on)for(const s of plats){
      if(s.drop)continue;
      if(p.x+p.hw>s.x&&p.x-p.hw<s.x+s.w&&y0<=s.y+.5&&p.y>=s.y){land(s,s.y);break;}
    }
  }else{
    for(const r of rocks){
      if(p.x+p.hw>r.x&&p.x-p.hw<r.x+r.w&&p.y-p.h<r.y+r.h&&y0-p.h>=r.y+r.h-.5){p.y=r.y+r.h+p.h;p.vy=0;break;}
    }
  }
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function txt(s,x,y,size,fill,align,o){

  ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.lineJoin='round';ctx.lineWidth=o.outline||size*.2;ctx.strokeStyle=INK;ctx.strokeText(s,x,y);
  ctx.fillStyle=fill;ctx.fillText(s,x,y);

function heart(x,y,s,full){

  ctx.bezierCurveTo(x+s*.7,y-s*.9,x+s*1.3,y,x,y+s*.9);ctx.closePath();
  ctx.fillStyle=full?'#f26b5b':'#3a1d57';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke();
  if(full){ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(x-s*.45,y-s*.25,s*.17,s*.28,.6,0,TAU);ctx.fill();}
}
function sparkle(x,y,r){
  ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill();
}

/* ---------- background ---------- */
let bgGrad=null;

STAR_L.forEach((l,li)=>{l.s=[];for(let i=0;i<l.n;i++)l.s.push({x:hash(li*100+i)*1000,y:hash(li*100+i+.5)*H*.95,r:lerp(l.r[0],l.r[1],hash(i+li*7.3)),ph:hash(i*3.1)*6});});
const PLANETS=[{x:620,y:130,r:78,c1:'#9a5bc4',c2:'#4a2468',ring:true},{x:1750,y:210,r:38,c1:'#f2a55b',c2:'#b4503f'},{x:2300,y:90,r:22,c1:'#6fd0c0',c2:'#2f7d78'}];

     ctx.closePath();ctx.fillStyle=j%2?'#7dffd6':'#b88cff';ctx.fill();}

  for(const n of NEB){

/* Cosmo is the commissioned artwork, cut into body / upper arms / forearms / thighs / shins and posed by rotating the joints.

const TH0_L=Math.atan2(RIGK.lsole[0]-RIG.lthigh.px,RIGK.lsole[1]-RIG.lthigh.py);   // leg tilt in the art; +TH0 makes it vertical
const TH0_R=Math.atan2(RIGK.rsole[0]-RIG.rthigh.px,RIGK.rsole[1]-RIG.rthigh.py);
const rigPose={la:0,lel:0,ra:0,rel:0,lth:0,lka:0,rth:0,rka:0,dy:0};

  const kx=knee.px-hip.px,ky=knee.py-hip.py,sx=sole[0]-knee.px,sy=sole[1]-knee.py;
  const c=Math.cos(ka),s=Math.sin(ka),ax=kx+sx*c-sy*s,ay=ky+sx*s+sy*c,c2=Math.cos(th),s2=Math.sin(th);

const G_L=footY(RIG.lthigh,RIG.lshin,RIGK.lsole,TH0_L,0),G_R=footY(RIG.rthigh,RIG.rshin,RIGK.rsole,TH0_R,0),GROUND=Math.max(G_L,G_R);

  if(!rigReady){drawCosmoVec(x,y,o);return;}
  const sc=(o.s||.85)/.85,hgt=78*sc,k=hgt/380,t=o.t||0,run=o.run||0;
  let rot=o.rot||0,tg=Object.assign({},REST),grounded=false;
  if(o.air){
    const v=clamp((o.vy||0)/420,-1,1),u=(v+1)/2;          // 0 rising .. 1 falling
    if(o.boost){

      tg.lth=TH0_L-.1;tg.rth=TH0_R-.05;tg.lka=.4;tg.rka=.3;tg.dy=-3;
    }else{
      tg.la=lerp(1.5,.55,u);tg.ra=-tg.la;tg.lel=lerp(-.2,-.45,u);tg.rel=lerp(-.2,-.45,u);
      tg.lth=TH0_L-lerp(.7,.25,u);tg.lka=lerp(.8,.25,u);       // lead leg: knee up, then reaches down
      tg.rth=TH0_R-lerp(.15,.05,u);tg.rka=lerp(.45,.12,u);        // trail leg

    const Aa=.5*run;                                          // arms counter-swing the legs

  for(const n in rigPose)rigPose[n]+=((n==='dy'?tg.dy:tg[n])-rigPose[n])*f;
  const P=rigPose;
  /* keep the lowest planted foot on the ground; spread legs lower the hips, like a real step */
  let dyBody=P.dy;

    const yl=footY(RIG.lthigh,RIG.lshin,RIGK.lsole,P.lth,P.lka),yr=footY(RIG.rthigh,RIG.rshin,RIGK.rsole,P.rth,P.rka);

  const limb=(top,bot,a,b)=>{                      // top rotates about its pivot; bot hangs off the joint and rotates again
    const t0=RIG[top],b0=RIG[bot];
    ctx.save();ctx.translate(ox+t0.px*k,oy+t0.py*k);ctx.rotate(a);
    ctx.save();ctx.translate((b0.px-t0.px)*k,(b0.py-t0.py)*k);ctx.rotate(b);img(bot);ctx.restore();
    img(top);ctx.restore();
  };
  limb('rthigh','rshin',P.rth,P.rka);
  limb('lthigh','lshin',P.lth,P.lka);
  ctx.save();ctx.translate(ox,oy);ctx.drawImage(RIG.base.img,0,0,RIG.base.img.width*k,RIG.base.img.height*k);ctx.restore();
  limb('lupper','lfore',P.la,P.lel);
  limb('rupper','rfore',P.ra,P.rel);
  ctx.restore();
}

/* ---------- loop ---------- */
const FIXED=1/120;let last=0,acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(state==='play'){acc+=dt;while(acc>=FIXED&&state==='play'){step(FIXED);acc-=FIXED;}}
  else if(state==='paused'){acc=0;}
  else{T+=dt;acc=0;updateFx(dt);if(state==='dead')deadT+=dt;}
  render();
  requestAnimationFrame(frame);
}
function fit(){
  const w=Math.max(320,cv.clientWidth),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*H/W);
  const fr=$('frame');if(fr&&fr.style)fr.style.setProperty('--u',(w*H/W/100)+'px');
}
/* ---------- full screen (CSS overlay, rotates itself on portrait phones) ---------- */

  $('fs').textContent='Full screen';
  fit();
}
function toggleFull(){full?exitFull():enterFull();}
$('fs').addEventListener('click',()=>{ensureAudio();toggleFull();});
$('fsExit').addEventListener('click',exitFull);
const menuBtn=$('menuBtn');
menuBtn.addEventListener('click',()=>{toMenu();try{cv.focus();}catch(_){}});
$('fsMenu').addEventListener('click',()=>toMenu());
let menuVis=null;
setInterval(()=>{const v=state!=='title';if(v!==menuVis){menuVis=v;menuBtn.hidden=!v;}{const fm=$('fsMenu');if(fm&&fm.style)fm.style.display=v?'':'none';}},150);
$('fsPause').addEventListener('click',()=>{if(state==='play')setPause(true);else if(state==='paused')setPause(false);});
document.addEventListener('fullscreenchange',()=>{if(full&&usedApi&&!document.fullscreenElement)exitFull();});
window.addEventListener('resize',orient);
window.addEventListener('orientationchange',()=>setTimeout(orient,200));
if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
fit();
try{document.fonts.load('32px "Lilita One"');document.fonts.load('500 12px "DM Mono"');}catch(e){}
if(typeof location!=='undefined'&&location.hash==='#rigtest')window.__dbg={drawCosmo,ctx,cv,rigPose,W,H};
resetWorld();p=makePlayer();cam={x:-100};
ensureWorld();
if(typeof location!=='undefined'&&location.hash==='#hz')window.__hz={
 go(x){cam.x=x-340;while(gx<cam.x+W+700)genChunk();},
 pick(kind){const a=kind==='gate'?gates:kind==='drone'?drones:plats.filter(q=>q.crystal);return a.filter(o=>o.x>3300)[0]||null;},
 put(x,y){p.x=x;p.y=y;p.vx=0;p.vy=0;cam.x=x-340;},
 wind(d){wind.state='blow';wind.t=5;wind.dir=d;},
 info(){return {gates:gates.length,drones:drones.length,cr:plats.filter(q=>q.crystal).length,gx,state}}
};
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
